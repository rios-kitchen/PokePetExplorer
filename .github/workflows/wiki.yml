# Publishes docs/wiki to the GitHub wiki whenever it changes on main (the folder is the only copy of the guide).
name: Wiki
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs/wiki into the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          rsync -a --exclude README.md docs/wiki/ wiki/
          cd wiki
          git config user.name "Rio's Kitchen"
          git config user.email "95362123+rios-kitchen@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki is up to date"; exit 0; fi
          git commit -m "Sync from ${GITHUB_SHA::7}: $(git -C .. log -1 --format=%s)"
          git push
