<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="whack.css">
</head>
<body>
  <div class="stage">
    <canvas id="field" width="480" height="420"></canvas>
    <div class="hud-top"><span id="score"></span><span id="time"></span></div>
    <div id="overlay" class="overlay">
      <div class="card">
        <b id="ovTitle"></b>
        <p id="ovText"></p>
        <button id="ovButton" class="primary"></button>
      </div>
    </div>
  </div>
  <p id="hint" class="hint"></p>
  <p id="count" class="count"></p>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/whack-rules.js"></script>
  <script src="whack.js"></script>
</body>
</html>
