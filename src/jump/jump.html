<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="jump.css">
</head>
<body data-phase="idle">
  <h1 id="title"></h1>
  <p id="score" class="score"></p>
  <div id="pond" class="pond">
    <div id="karp" class="karp"><span>🐟</span></div>
    <div id="height" class="height"></div>
    <div class="water"></div>
  </div>
  <div id="bar" class="bar">
    <div id="zOk" class="zone ok"></div><div id="zGood" class="zone good"></div><div id="zPerfect" class="zone perfect"></div>
    <div id="needle" class="needle"></div>
  </div>
  <p id="verdict" class="verdict"></p>
  <div class="foot">
    <button id="next" class="primary hidden"></button>
    <p id="keys" class="count"></p>
    <p id="count" class="count"></p>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/anim.js"></script>
  <script src="jump.js"></script>
</body>
</html>
