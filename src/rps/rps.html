<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="rps.css">
</head>
<body>
  <h1 id="title"></h1>
  <p id="score" class="score"></p>
  <div class="arena">
    <div class="side"><span class="lbl" id="youLbl"></span><div id="you" class="hand">?</div></div>
    <div class="vs">VS</div>
    <div class="side"><span class="lbl" id="themLbl"></span><div id="them" class="hand">?</div></div>
  </div>
  <p id="verdict" class="verdict"></p>
  <div id="moves" class="moves"></div>
  <div class="foot">
    <button id="next" class="primary hidden"></button>
    <p id="count" class="count"></p>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="rps.js"></script>
</body>
</html>
