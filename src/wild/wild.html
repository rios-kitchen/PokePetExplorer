<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="wild.css">
</head>
<body>
  <div class="stage">
    <canvas id="scene" width="480" height="288"></canvas>
    <div id="field" class="field hidden"></div>
    <div id="wildBox" class="hpbox wild hidden"><img id="wildFace" class="face hidden" alt=""><div class="row"><b class="name"></b><span class="lv"></span></div><div class="bar"><div></div></div><span class="st"></span><div class="tags"></div></div>
    <div id="meBox" class="hpbox me hidden"><img id="meFace" class="face hidden" alt=""><div class="row"><b class="name"></b><span class="lv"></span></div><div class="bar"><div></div></div><div class="row small"><span class="st"></span><span class="hp"></span></div><div class="tags"></div></div>
    <div id="result" class="result hidden"><div class="card"><b id="resTitle"></b><p id="resText"></p></div><button id="resOk" class="primary"></button></div>
  </div>
  <div class="panel">
    <p id="log"></p>
    <div id="menu" class="menu"></div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/maps.js"></script>
  <script src="wild.js"></script>
</body>
</html>
