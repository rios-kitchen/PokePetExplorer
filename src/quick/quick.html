<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="quick.css">
</head>
<body data-phase="idle">
  <h1 id="title"></h1>
  <p id="score" class="score"></p>
  <div id="arena" class="arena">
    <div id="face" class="face"></div>
    <div id="bang" class="bang">!</div>
    <div id="ms" class="ms"></div>
  </div>
  <div id="dots" class="dots"></div>
  <p id="verdict" class="verdict"></p>
  <div class="foot">
    <button id="next" class="primary hidden"></button>
    <p id="count" class="count"></p>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/anim.js"></script>
  <script src="quick.js"></script>
</body>
</html>
