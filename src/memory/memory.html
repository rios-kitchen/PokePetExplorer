<!doctype html>
<html>
<head>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="memory.css">
</head>
<body>

    <div class="hud"><span id="turns"></span><span id="pairs"></span></div>

  </div>
  <p id="hint" class="hint"></p>
  <p id="count" class="count"></p>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="../shared/memory-rules.js"></script>
  <script src="memory.js"></script>

</html>
