<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="puzzle.css">
</head>
<body data-phase="idle">
  <h1 id="title"></h1>
  <p id="score" class="score"></p>
  <div class="wrap">
    <div id="board" class="board"></div>
    <div class="side"><div id="preview" class="preview"></div><span id="previewLbl" class="lbl"></span></div>
  </div>
  <p id="verdict" class="verdict"></p>
  <div class="foot">
    <button id="next" class="primary hidden"></button>
    <button id="hint" class="hintbtn hidden"></button>
    <p id="count" class="count"></p>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="puzzle.js"></script>
</body>
</html>
