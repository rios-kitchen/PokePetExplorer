<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PokePet Explorer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="hero">
    <canvas id="heroSprite" width="64" height="64"></canvas>
    <div class="hero-info">
      <div class="hero-name"><span id="heroName"></span> <span id="heroLevel" class="lv"></span></div>
      <div class="bar xp"><div id="heroXp"></div></div>
      <div class="hero-meta">
        <span id="heroXpText"></span>
        <span class="mood"><span id="heroBerries" class="berries"></span> · <span data-i18n="poke.mood"></span> <span id="heroMood"></span></span>
      </div>
    </div>
  </header>

  <!-- work | raising & fun | settings -->
  <nav class="tabs" role="tablist">
    <button data-tab="work"><i>💼</i><span data-i18n="tab.work"></span></button>
    <span class="tab-sep" aria-hidden="true"></span>
    <!-- every day: tasks and the diary side by side -->
    <button data-tab="today"><i>📅</i><span data-i18n="tab.today"></span></button>
    <button data-tab="diary"><i>📔</i><span data-i18n="tab.diary"></span></button>
    <span class="tab-sep" aria-hidden="true"></span>
    <!-- raising: the team, its care, the shop, going out, and what you've collected -->
    <button data-tab="pokemon"><i>🐾</i><span data-i18n="tab.pokemon"></span></button>
    <button data-tab="care"><i>🍓</i><span data-i18n="tab.care"></span></button>
    <button data-tab="shop"><i>🛒</i><span data-i18n="tab.shop"></span></button>
    <button data-tab="expedition"><i>🧭</i><span data-i18n="tab.expedition"></span></button>
    <button data-tab="dex"><i>📖</i><span data-i18n="tab.dex"></span></button>
    <span class="tab-sep" aria-hidden="true"></span>
    <button data-tab="settings"><i>⚙️</i><span data-i18n="tab.settings"></span></button>
  </nav>

  <section id="noPet" class="no-pet hidden">
    <div class="no-pet-ball">🔴</div>
    <p data-i18n="starter.noPet"></p>
    <button id="goStarter" class="primary" data-i18n="starter.go"></button>
  </section>
  <main>
    <!-- WORK: Pomodoro + to-dos (everything about getting things done) -->
    <section id="tab-work" class="tab">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-center">
          <div id="phaseLabel" class="phase"></div>
          <div id="timeLabel" class="time">25:00</div>
          <div id="roundLabel" class="round"></div>
        </div>
      </div>

      <div class="controls" id="timerControls"></div>

      <label class="field">
        <span data-i18n="pomo.task"></span>
        <select id="taskSelect"></select>
      </label>

      <div class="today">
        <span data-i18n="pomo.today"></span>
        <span id="todayTomatoes" class="tomatoes"></span>
      </div>


      <h3 id="todoHead" data-i18n="todo.title"></h3>
      <form id="todoForm" class="todo-form">
        <input id="todoText" type="text" maxlength="200" autocomplete="off" data-i18n-placeholder="todo.placeholder">
        <button type="submit" class="primary" data-i18n="todo.add"></button>
        <label class="due-toggle" data-i18n-title="todo.due">⏰<input id="todoDue" type="datetime-local"></label>
      </form>
      <div class="seg" id="todoFilter">
        <button data-filter="open" data-i18n="todo.active"></button>
        <button data-filter="done" data-i18n="todo.done"></button>
      </div>
      <ul id="todoList" class="todo-list"></ul>
      <p id="todoEmpty" class="empty"></p>
      <button id="clearDone" class="link" data-i18n="todo.clearDone"></button>

      <details class="card">
        <summary data-i18n="pomo.durations"></summary>
        <div class="grid2">
          <label class="field small"><span data-i18n="pomo.focusLen"></span><input type="number" min="1" max="180" data-pomo="focus"></label>
          <label class="field small"><span data-i18n="pomo.shortLen"></span><input type="number" min="1" max="180" data-pomo="short"></label>
          <label class="field small"><span data-i18n="pomo.longLen"></span><input type="number" min="1" max="180" data-pomo="long"></label>
          <label class="field small"><span data-i18n="pomo.longEvery"></span><input type="number" min="1" max="12" data-pomo="longEvery"></label>
        </div>
        <label class="check"><input type="checkbox" id="autoBreak"> <span data-i18n="pomo.autoBreak"></span></label>
        <div class="sound-row">
          <span data-i18n="pomo.sounds"></span>
          <div class="sound-buttons">
            <button class="ghost" data-sound="focusStart" data-i18n="pomo.snd.focusStart"></button>
            <button class="ghost" data-sound="focusEnd" data-i18n="pomo.snd.focusEnd"></button>
            <button class="ghost" data-sound="breakStart" data-i18n="pomo.snd.breakStart"></button>
            <button class="ghost" data-sound="breakEnd" data-i18n="pomo.snd.breakEnd"></button>
          </div>
        </div>
      </details>
    </section>

    <!-- CARE -->
    <section id="tab-care" class="tab">
      <div id="careStatus" class="care-status"></div>
      <div id="careBars" class="care-bars"></div>
      <h3 data-i18n="care.shop"></h3>
      <div id="careItems" class="care-items"></div>
      <p id="careMsg" class="hint"></p>
    </section>

    <!-- SHOP: buy into the bag -->
    <section id="tab-shop" class="tab">
      <h3 id="shopHead"></h3>
      <p class="hint" data-i18n="shop.hint"></p>
      <div id="shopItems" class="shop-items"></div>
      <p id="shopMsg" class="hint"></p>
      <h3 data-i18n="shop.held"></h3>
      <p class="hint" data-i18n="shop.heldHint"></p>
      <div id="shopHeld" class="shop-items"></div>
      <h3 data-i18n="shop.evo"></h3>
      <p class="hint" data-i18n="shop.evoHint"></p>
      <div id="shopEvo" class="shop-items"></div>
      <p id="careEarn" class="hint"></p>
    </section>

    <!-- TODAY: sign-in and daily tasks -->
    <section id="tab-today" class="tab">
      <h3 data-i18n="today.sign"></h3>
      <div id="signRow" class="sign-row"></div>
      <div class="sign-foot"><span id="signStreak" class="hint"></span><button id="signBtn" class="primary"></button></div>
      <p class="hint" data-i18n="today.signHint"></p>
      <h3 data-i18n="today.tasks"></h3>
      <div id="taskList" class="task-list"></div>
      <p id="taskBonus" class="hint"></p>
    </section>

    <!-- EXPEDITION -->
    <section id="tab-expedition" class="tab">
      <!-- going out to play: the tall grass (battles) and the pond -->
      <h3 data-i18n="out.play"></h3>
      <div class="battle-bar"></div>
      <div class="fish-bar"><button id="goFish" class="secondary" data-i18n="dex.goFish"></button><span id="fishLeft" class="hint"></span></div>
      <h3 data-i18n="out.expeditions"></h3>
      <div id="expStats" class="exp-stats"></div>
      <div id="expActive"></div>
      <div id="expList"></div>
      <p id="expMsg" class="hint"></p>
    </section>

    <!-- DEX: achievements and collections -->
    <section id="tab-dex" class="tab">
      <!-- every part can be folded; which ones are open is remembered (panel.js folds) -->
      <details class="fold" data-fold="album" open>
        <summary><h3 data-i18n="dex.album"></h3></summary>
        <p class="hint" id="albumHint"></p>
        <div id="albumList" class="album"></div>
      </details>
      <details class="fold" data-fold="pokedex">
        <summary><h3 id="pokedexHead" class="dex-head"></h3></summary>
        <p id="pokedexLine" class="hint"></p>
        <div id="pokedexList" class="fishdex pokedex"></div>
      </details>
      <details class="fold" data-fold="fishdex">
        <summary><h3 id="fishHead"></h3></summary>
        <div id="fishList" class="fishdex"></div>
      </details>
      <details class="fold" data-fold="achievements">
        <summary><h3 data-i18n="dex.achievements"></h3></summary>
        <div id="achList" class="ach-list"></div>
      </details>
      <details class="fold" data-fold="souvenirs">
        <summary><h3 data-i18n="dex.souvenirs"></h3></summary>
        <div id="souvenirList" class="souvenirs"></div>
      </details>
      <details class="fold" data-fold="favorites">
        <summary><h3 id="favHead"></h3></summary>
        <div id="favList" class="album"></div>
      </details>
    </section>

    <!-- DIARY -->
    <section id="tab-diary" class="tab">
      <div class="week-nav">
        <button id="weekPrev" class="ghost" aria-label="previous week">‹</button>
        <div id="weekLabel" class="week-label"></div>
        <button id="weekNext" class="ghost" aria-label="next week">›</button>
      </div>
      <div id="weekCard" class="card week-card"></div>
      <div class="card chart-card">
        <div class="chart-title" data-i18n="diary.focusChart"></div>
        <div id="focusBars" class="chart"></div>
      </div>
      <div class="card chart-card">
        <div class="chart-title" data-i18n="diary.timeline"></div>
        <div id="focusTimeline" class="chart"></div>
      </div>
      <h3 data-i18n="diary.entries"></h3>
      <div id="diaryEntries" class="diary-entries"></div>
      <div id="chartTip" class="chart-tip hidden"></div>
    </section>

    <!-- POKEMON -->
    <section id="tab-pokemon" class="tab">
      <h3 data-i18n="poke.team"></h3>
      <div id="pokeGrid" class="poke-grid"></div>
      <p id="pokeStatus" class="hint"></p>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab">
      <label class="field row">
        <span data-i18n="set.language"></span>
        <select id="setLang"><option value="en">English</option><option value="zh">中文</option></select>
      </label>
      <div class="field row">
        <span data-i18n="set.size"></span>
        <div class="seg" id="setScale">
          <button data-scale="2" data-i18n="size.2"></button>
          <button data-scale="3" data-i18n="size.3"></button>
          <button data-scale="4" data-i18n="size.4"></button>
          <button data-scale="5" data-i18n="size.5"></button>
        </div>
      </div>
      <label class="field row">
        <span data-i18n="set.reminder"></span>
        <select id="setReminder"></select>
      </label>
      <label class="check"><input type="checkbox" id="setWalk"> <span data-i18n="set.walk"></span></label>
      <label class="check"><input type="checkbox" id="setReact"> <span data-i18n="set.reactInput"></span></label>
      <label class="check"><input type="checkbox" id="setSound"> <span data-i18n="set.sound"></span></label>
      <label class="check"><input type="checkbox" id="setLogin"> <span data-i18n="set.login"></span></label>
      <label class="check"><input type="checkbox" id="setFullscreen"> <span data-i18n="set.hideFullscreen"></span></label>
      <button id="resetPos" class="secondary" data-i18n="set.resetPos"></button>

      <h3 data-i18n="wx.title"></h3>
      <div class="wx-box">
        <label class="check"><input type="checkbox" id="setGreetings"> <span data-i18n="wx.greetings"></span></label>
        <label class="check"><input type="checkbox" id="wxEnabled"> <span data-i18n="wx.enable"></span></label>
        <p class="hint" data-i18n="wx.hint"></p>
        <form id="wxForm" class="ai-model hidden" autocomplete="off">
          <input id="wxCity" type="text" data-i18n-placeholder="wx.cityPlaceholder">
          <button class="secondary" type="submit" data-i18n="wx.find"></button>
        </form>
        <p id="wxStatus" class="hint"></p>
      </div>

      <h3 data-i18n="ai.title"></h3>
      <div class="ai-box">
        <label class="check"><input type="checkbox" id="aiEnabled"> <span data-i18n="ai.enable"></span></label>
        <p class="hint" data-i18n="ai.hint"></p>
        <div id="aiFields" class="ai-fields">
          <label class="field row"><span data-i18n="ai.provider"></span><select id="aiProvider"></select></label>
          <label class="field" id="aiUrlRow"><span data-i18n="ai.url"></span><input id="aiUrl" type="text" spellcheck="false" placeholder="https://…/v1"></label>
          <label class="field"><span data-i18n="ai.model"></span>
            <div class="ai-model"><input id="aiModel" type="text" list="aiModelList" spellcheck="false"><button id="aiFetch" class="secondary" type="button" data-i18n="ai.fetch"></button></div>
            <datalist id="aiModelList"></datalist>
          </label>
          <label class="field" id="aiKeyRow"><span data-i18n="ai.key"></span>
            <div class="ai-model"><input id="aiKey" type="password" spellcheck="false" autocomplete="off"><button id="aiSaveKey" class="secondary" type="button" data-i18n="ai.saveKey"></button></div>
          </label>
          <div class="ai-actions">
            <button id="aiTest" class="secondary" type="button" data-i18n="ai.test"></button>
            <button id="aiOpen" class="primary" type="button" data-i18n="ai.open"></button>
          </div>
          <p id="aiStatus" class="hint"></p>
        </div>
      </div>

      <h3 data-i18n="upd.title"></h3>
      <div class="update-box">
        <div class="update-row">
          <span id="updVersion" class="hint"></span>
          <button id="updCheck" class="secondary" data-i18n="upd.check"></button>
        </div>
        <p id="updStatus" class="hint"></p>
        <div id="updProgress" class="meter hidden"><div></div></div>
        <button id="updDownload" class="primary hidden"></button>
        <a id="updTrouble" class="link hidden" href="#" data-i18n="upd.trouble"></a>
        <label class="check"><input type="checkbox" id="setUpdates"> <span data-i18n="upd.auto"></span></label>
      </div>

      <h3 data-i18n="set.stats"></h3>
      <div class="stats">
        <div><b id="stToday"></b><span data-i18n="stat.today"></span></div>
        <div><b id="stPomos"></b><span data-i18n="stat.totalPomos"></span></div>
        <div><b id="stMinutes"></b><span data-i18n="stat.focusMin"></span></div>
        <div><b id="stTodos"></b><span data-i18n="stat.todosDone"></span></div>
      </div>
      <p class="hint" data-i18n="set.data"></p>

      <h3 id="aboutTitle" data-i18n="about.title"></h3>
      <form id="extraForm" class="extra hidden" autocomplete="off"><input id="extraInput" type="text" spellcheck="false"></form>
      <div class="about-links">
        <a href="#" class="link" data-link="wiki" data-i18n="about.wiki"></a>
        <a href="#" class="link" data-link="issues" data-i18n="about.issues"></a>
      </div>
      <div class="about">
        <p><b>PMD SpriteCollab</b> – <span data-i18n="about.pmd"></span></p>
        <p><b>PokéAPI</b> – <span data-i18n="about.pokeapi"></span></p>
        <p class="hint" data-i18n="about.disclaimer"></p>
        <p class="hint" data-i18n="about.license"></p>
      </div>
    </section>
  </main>
  <div id="lightbox" class="lightbox hidden"><img alt=""></div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/sprites.js"></script>
  <script src="../shared/sound.js"></script>
  <script src="care-diary.js"></script>
  <script src="raising.js"></script>
  <script src="panel.js"></script>
</body>
</html>
